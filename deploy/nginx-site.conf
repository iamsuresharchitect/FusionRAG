# /etc/nginx/sites-available/yourdomain.com   (Step 16)
# Replace yourdomain.com with your real domain (2 places), then run Step 17.
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow document uploads up to 25 MB (Nginx default is 1 MB -> "413 Request Entity Too Large")
    client_max_body_size 25m;

    # --- Frontend: everything not matched below ---
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Backend API: anything starting with /api (trailing slash strips /api) ---
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming answers from Claude (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
