# FusionRAG: hybrid RAG (BM25 + vectors + RRF) answered by Claude.
#
# Laptop:  docker compose up --build        -> http://localhost:3000
# VPS:     the root .env adds deploy/docker-compose.traefik.yml so Traefik
#          serves https://APP_DOMAIN (see README, Part 2).
services:

  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      # BIND_IP defaults to 0.0.0.0 (handy for testing on the laptop).
      # The VPS sets BIND_IP=127.0.0.1 so 8000 is not reachable from the internet.
      - "${BIND_IP:-0.0.0.0}:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
    volumes:
      - rag-data:/data            # uploaded-document index survives rebuilds
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "${BIND_IP:-0.0.0.0}:3000:80"   # visit localhost:3000 in the browser
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  rag-data:

networks:
  app-network:
    driver: bridge
