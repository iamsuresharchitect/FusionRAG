server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads (Nginx default is only 1 MB)
    client_max_body_size 25m;

    # API calls -> backend container. Makes http://localhost:3000 fully work
    # during local testing (Step 6). The service name "backend" works as a
    # hostname on the shared Docker network. The trailing slash strips /api.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream Claude's answer token by token
        proxy_read_timeout 300s;      # large uploads take time to embed
    }

    # Send every unknown path back to index.html so React can handle it
    location / {
        try_files $uri $uri/ /index.html;
    }
}
